<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ים של ציורים</title>
<link rel="stylesheet" href="/ui.css">
<style>
  body{min-height:100vh;background:linear-gradient(180deg,#54d3e6,#1368a8 60%,#073a6d);color:#fff;display:grid;place-items:center;padding:24px}
  .box{max-width:760px;width:100%;text-align:center}
  h1{font-size:clamp(34px,7vw,64px);margin:0 0 6px;text-shadow:0 4px 20px rgba(2,22,52,.4)}
  h1 span{background:linear-gradient(90deg,#ffe27a,#ff9d5c);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:1.15rem;opacity:.95;margin:0 0 26px}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  a.c{display:block;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:26px;padding:22px 16px;color:#fff;text-decoration:none;backdrop-filter:blur(8px);transition:transform .15s}
  a.c:hover{transform:translateY(-4px);background:rgba(255,255,255,.24)}
  a.c b{display:grid;place-items:center;height:56px;color:#ffe27a}a.c strong{display:block;font-size:1.25rem;margin:4px 0}a.c span{opacity:.9;font-size:.95rem}
</style></head>
<body><div class="box">
  <h1>ים של <span>ציורים</span></h1>
  <p>צובעים חיה על דף, מצלמים בטלפון, והיא שוחה על הטלוויזיה</p>
  <div class="cards">
    <a class="c" href="/print"><b data-ic="crayon"></b><strong>דפי צביעה</strong><span>להדפסה בבית</span></a>
    <a class="c" href="/scan"><b data-ic="phone"></b><strong>סריקה</strong><span>פותחים בטלפון</span></a>
    <a class="c" href="/tv"><b data-ic="fish"></b><strong>האקווריום</strong><span>פותחים על המסך הגדול</span></a>
  </div>
</div><script src="/icons.js"></script><script>[].forEach.call(document.querySelectorAll("[data-ic]"),function(e){e.innerHTML=Icons.svg(e.dataset.ic,46)})</script></body></html>
